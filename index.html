<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision Bracket STL Generator</title>
  <meta name="description" content="Generate and download custom 3D printable STL mounting brackets completely client-side. Real-time 3D preview, customize hole sizes, thickness, and dimensions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Control Panel -->
    <aside class="control-panel glass">
      <header class="app-header">
        <div class="logo-container">
          <svg class="app-logo" viewBox="0 0 24 24" width="32" height="32">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <div>
            <h1>BracketCraft</h1>
            <p class="tagline">Client-Side 3D STL Exporter</p>
          </div>
        </div>
      </header>

      <section class="style-section">
        <h3>Styles</h3>
        <div class="style-buttons">
          <button class="btn btn-secondary active" id="style-phone" data-style="phone">Phone Cradle</button>
          <button class="btn btn-secondary" id="style-cards" data-style="cards">Playing Cards</button>
          <button class="btn btn-secondary" id="style-battery" data-style="battery">Battery Mount</button>
          <button class="btn btn-secondary" id="style-underDesk" data-style="underDesk">Under Desk</button>
        </div>
      </section>

      <div class="scrollable-controls" id="controls-container">
        <!-- Sliders and checkboxes will be dynamically rendered here by the AppBuilder -->
      </div>

      <footer class="actions">
        <button class="btn btn-primary btn-block" id="btn-export">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 16l-5-5h3V4h4v7h3l-5 5zm9 2v2H3v-2h18z"/>
          </svg>
          Export STL File
        </button>
        <div class="stats-row">
          <span class="export-stats" id="export-stats">Triangles: 0 | Est. Size: 0 KB</span>
        </div>
      </footer>
    </aside>

    <!-- 3D Viewport -->
    <main class="viewport-container">
      <div id="canvas-container"></div>
      <div class="viewport-overlay">
        <div class="control-hint">
          <span class="hint-item">Left-click + drag to rotate</span>
          <span class="hint-divider">|</span>
          <span class="hint-item">Right-click + drag to pan</span>
          <span class="hint-divider">|</span>
          <span class="hint-item">Scroll to zoom</span>
        </div>
        <div class="stats-badge" id="stats-badge">
          Dimension: 50 x 60 x 30 mm
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
