<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision Bracket STL Generator</title>
  <meta name="description" content="Generate and download custom 3D printable STL mounting brackets completely client-side. Real-time 3D preview, customize hole sizes, thickness, and dimensions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Control Panel -->
    <aside class="control-panel glass">
      <header class="app-header">
        <div class="logo-container">
          <svg class="app-logo" viewBox="0 0 24 24" width="32" height="32">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <div>
            <h1>BracketCraft</h1>
            <p class="tagline">Client-Side 3D STL Exporter</p>
          </div>
        </div>
      </header>

      <section class="preset-section">
        <h3>Presets</h3>
        <div class="preset-buttons">
          <button class="btn btn-secondary active" id="preset-standard" data-preset="standard">Standard</button>
          <button class="btn btn-secondary" id="preset-heavy" data-preset="heavy">Heavy Duty</button>
          <button class="btn btn-secondary" id="preset-small" data-preset="small">Mini</button>
        </div>
      </section>

      <div class="scrollable-controls">
        <section class="parameter-section">
          <h3>Dimensions (mm)</h3>
          
          <div class="input-group">
            <div class="input-header">
              <label for="input-width">Horizontal Leg (X)</label>
              <span class="value-display" id="val-width">50</span>
            </div>
            <input type="range" id="input-width" min="20" max="150" value="50" step="1">
          </div>

          <div class="input-group">
            <div class="input-header">
              <label for="input-height">Vertical Leg (Y)</label>
              <span class="value-display" id="val-height">60</span>
            </div>
            <input type="range" id="input-height" min="20" max="150" value="60" step="1">
          </div>

          <div class="input-group">
            <div class="input-header">
              <label for="input-depth">Width / Depth (Z)</label>
              <span class="value-display" id="val-depth">30</span>
            </div>
            <input type="range" id="input-depth" min="10" max="100" value="30" step="1">
          </div>

          <div class="input-group">
            <div class="input-header">
              <label for="input-thickness">Material Thickness</label>
              <span class="value-display" id="val-thickness">4</span>
            </div>
            <input type="range" id="input-thickness" min="2" max="15" value="4" step="0.5">
          </div>

          <h3>Holes</h3>

          <div class="input-group">
            <div class="input-header">
              <label for="input-hole-dia">Hole Diameter</label>
              <span class="value-display" id="val-hole-dia">5.0</span>
            </div>
            <input type="range" id="input-hole-dia" min="0" max="16" value="5" step="0.5">
          </div>

          <div class="input-group">
            <div class="input-header">
              <label for="input-hole-count">Holes per Leg</label>
              <span class="value-display" id="val-hole-count">2</span>
            </div>
            <input type="range" id="input-hole-count" min="0" max="4" value="2" step="1">
          </div>

          <h3>Reinforcement</h3>

          <div class="input-group-checkbox">
            <input type="checkbox" id="input-gusset" checked>
            <label for="input-gusset">Add Reinforcing Gusset</label>
          </div>

          <div class="input-group" id="gusset-thickness-group">
            <div class="input-header">
              <label for="input-gusset-thickness">Gusset Thickness</label>
              <span class="value-display" id="val-gusset-thickness">4.0</span>
            </div>
            <input type="range" id="input-gusset-thickness" min="1" max="12" value="4" step="0.5">
          </div>
        </section>
      </div>

      <footer class="actions">
        <button class="btn btn-primary btn-block" id="btn-export">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 16l-5-5h3V4h4v7h3l-5 5zm9 2v2H3v-2h18z"/>
          </svg>
          Export STL File
        </button>
        <div class="stats-row">
          <span class="export-stats" id="export-stats">Triangles: 0 | Est. Size: 0 KB</span>
        </div>
      </footer>
    </aside>

    <!-- 3D Viewport -->
    <main class="viewport-container">
      <div id="canvas-container"></div>
      <div class="viewport-overlay">
        <div class="control-hint">
          <span class="hint-item">Left-click + drag to rotate</span>
          <span class="hint-divider">|</span>
          <span class="hint-item">Right-click + drag to pan</span>
          <span class="hint-divider">|</span>
          <span class="hint-item">Scroll to zoom</span>
        </div>
        <div class="stats-badge" id="stats-badge">
          Dimension: 50 x 60 x 30 mm
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
